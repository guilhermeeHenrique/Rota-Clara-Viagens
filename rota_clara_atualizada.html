<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102338">
<title>Rota Clara — Organizador de viagens em grupo</title>
<style>
:root{--ink:#173049;--muted:#698096;--blue:#176e83;--blue2:#e7f5f5;--bg:#f3f6f8;--paper:#fff;--line:#dfe7eb;--good:#148064;--amber:#b57516;--bad:#be4747;--shadow:0 10px 36px rgba(14,40,56,.065);--radius:17px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.48 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:#08758d;text-underline-offset:3px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(7,130,155,.24);outline-offset:2px}
.app{min-height:100vh;display:grid;grid-template-columns:260px minmax(0,1fr)}
.side{background:#102638;color:#dfeef2;min-height:100vh;padding:24px 15px 18px;position:sticky;top:0;height:100vh;overflow-y:auto;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:11px;margin:0 8px 30px}
.mark{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:#3bc3b4;color:#0b3140;font-weight:900;font-size:19px}
.brand strong{color:white;font-size:17px;letter-spacing:-.45px}
.brand small{display:block;color:#a2bac8;font-size:11px}
.nav-group{color:#92aabd;text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:1.5px;margin:18px 13px 8px}
.sidebtn,.route-nav{width:100%;border:0;text-align:left;background:transparent;color:#d3e5ea;padding:11px 12px;border-radius:10px;display:flex;gap:10px;align-items:center}
.sidebtn:hover,.route-nav:hover{background:#213f50}
.sidebtn.active,.route-nav.active{background:#245768;color:white;font-weight:700}
.route-nav{margin:2px 0;justify-content:space-between;align-items:start;gap:6px}
.route-nav .route-text{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.route-nav small{color:#adcad5;font-size:10px;white-space:nowrap}
.sidecount{font-size:10px;border:1px solid #3d5969;border-radius:7px;padding:2px 6px;color:#d0e0e8}
.sidebottom{margin-top:26px;border-top:1px solid #304758;padding-top:15px}
.sidehint{color:#9db4c2;font-size:11px;line-height:1.55;margin:12px 9px}
.main{min-width:0}
.topbar{min-height:85px;background:rgba(255,255,255,.96);display:flex;gap:18px;align-items:center;justify-content:space-between;padding:17px clamp(18px,3.3vw,45px);border-bottom:1px solid var(--line)}
.topbar-title{min-width:0}
.topbar-title h1{font-size:23px;letter-spacing:-.8px;line-height:1.2;margin:0 0 4px;font-weight:800}
.topbar-title p{color:var(--muted);margin:0;font-size:12px}
.top-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.content{margin:0 auto;max-width:1620px;padding:25px clamp(18px,3.3vw,45px) 70px}
button.btn{border:1px solid transparent;border-radius:10px;padding:10px 13px;background:var(--blue);color:white;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:730;white-space:nowrap;transition:background .18s,transform .18s}
.btn:hover{background:#095467}
.btn:active{transform:translateY(1px)}
.btn.secondary{background:white;border-color:var(--line);color:var(--ink)}
.btn.secondary:hover{background:#f2f8fa}
.btn.ghost{background:transparent;color:var(--blue);border-color:var(--line)}
.btn.ghost:hover{background:var(--blue2)}
.btn.danger{color:#af4141;background:#fff3f3;border-color:#f3cdcd}
.btn.danger:hover{background:#ffe5e5}
.btn.small{padding:7px 10px;border-radius:8px;font-size:12px}
.btn.tiny{padding:5px 8px;border-radius:7px;font-size:11px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card.pad{padding:23px}
.muted{color:var(--muted)}
.micro{font-size:11px;color:var(--muted)}
.eyebrow{text-transform:uppercase;color:#587789;font-size:10px;font-weight:800;letter-spacing:1.3px}
.headline{font-weight:800;font-size:21px;letter-spacing:-.6px;margin:0 0 6px}
.section-heading{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:27px 0 14px}
.section-heading h2{font-size:17px;letter-spacing:-.35px;margin:0}
.section-heading p{font-size:12px;color:var(--muted);margin:3px 0 0}
.stat-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}
.stat{padding:20px;background:white;border:1px solid var(--line);border-radius:15px}
.stat .label{font-size:12px;color:var(--muted);margin-bottom:8px}
.stat strong{display:block;font-size:24px;line-height:1.18;letter-spacing:-.8px}
.stat small{display:block;color:var(--muted);font-size:11px;margin-top:7px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 302px;align-items:start;gap:19px}
.editor{min-width:0}
.summary{position:sticky;top:20px;padding:21px}
.summary h3{font-size:16px;letter-spacing:-.3px;margin:0 0 13px}
.sumrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;border-bottom:1px solid #edf0f3;padding:8px 0;font-size:12px}
.sumrow strong{font-variant-numeric:tabular-nums}
.sumtotal{background:#ecf8f7;border-radius:13px;padding:14px;margin:16px 0}
.sumtotal strong{font-size:27px;color:#116a68;letter-spacing:-1px}
.sumtotal .over{font-size:11px;color:#4d7c78}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:750;border-radius:999px;padding:4px 9px;background:#edf2f5;color:#516c7f;white-space:nowrap}
.pill.good{background:#e0f5ee;color:#167b5f}
.pill.warn{background:#fff0d8;color:#92620c}
.pill.bad{background:#ffe9e9;color:#af4646}
.pill.light{background:#eaf5f8;color:#1d7789}
.notice{background:#f6f9fa;border:1px solid #e3eaed;padding:13px;border-radius:11px;font-size:12px;color:#597182;line-height:1.62}
.notice.warn{background:#fff9ed;border-color:#f2dfbd;color:#8e641e}
.notice.good{background:#ecf8f0;border-color:#c9e8d8;color:#246c51}
.notice + .notice{margin-top:8px}
.form-field{display:flex;flex-direction:column;gap:5px;min-width:0}
.form-field label{font-size:11px;font-weight:750;color:#426074}
.form-field input,.form-field select,.form-field textarea,.city-search{border:1px solid #d8e2e8;border-radius:9px;padding:10px 11px;min-width:0;width:100%;background:#fff;color:var(--ink);font-size:12px;line-height:1.35}
.form-field textarea{min-height:73px;resize:vertical}
.form-field input:focus,.form-field textarea:focus,.form-field select:focus{border-color:#2d94a4}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.tabbar{display:flex;gap:6px;overflow:auto;scrollbar-width:thin;border-bottom:1px solid var(--line);padding:0 2px 10px;margin-bottom:18px}
.tabbar button{background:transparent;border:1px solid transparent;color:#667d8c;padding:9px 12px;border-radius:9px;white-space:nowrap;font-size:12px;font-weight:750}
.tabbar button:hover{background:#f2f8f9}
.tabbar button.active{background:#e4f4f3;border-color:#cce5e4;color:#096674}
.subcard{border:1px solid #e0e8ec;border-radius:13px;background:#fff;padding:18px;margin:13px 0}
.subcard-head{display:flex;justify-content:space-between;gap:10px;align-items:start;margin-bottom:14px;flex-wrap:wrap}
.subcard-head h3{margin:0;font-size:15px}
.subcard-head p{margin:4px 0 0;color:var(--muted);font-size:12px}
.option{border:1px solid #e1e9ed;border-radius:12px;padding:14px;background:#fcfdfd;margin:11px 0;position:relative}
.option.chosen{border:1px solid #65b4b5;background:#f7fdfc}
.option-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.option-head .left{display:flex;align-items:center;gap:10px}
.option-title{font-weight:800;font-size:12px}
.option-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.trip-label{display:flex;align-items:center;gap:9px;margin:10px 0;font-size:12px;color:#547080}
.trip-label .arrow{font-size:18px;color:#228e8a}
.citycard{display:flex;gap:12px;align-items:start;justify-content:space-between;background:#fdfefe;border:1px solid var(--line);padding:13px;margin:10px 0;border-radius:12px}
.citycard.dragging{opacity:.42}
.citycard.over{border:2px dashed #11989a}
.draghandle{font-size:20px;letter-spacing:-3px;color:#93a8b4;cursor:grab;padding:4px;user-select:none}
.citybody{min-width:0;flex:1}
.citytop{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.8fr);gap:10px}
.citycontrols{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.geores{margin-top:10px}
.geoitem{background:#f4f9fa;border:1px solid #dce9ed;border-radius:8px;padding:8px 10px;display:block;width:100%;text-align:left;color:#2d5362;margin:5px 0;font-size:12px}
.geoitem:hover{background:#e8f6f6}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:grid;gap:12px}
.divider{border:0;border-top:1px solid var(--line);margin:17px 0}
.empty{background:white;border:1px dashed #bfcfd6;border-radius:17px;padding:44px 22px;text-align:center}
.empty .symbol{font-size:35px;margin-bottom:8px}
.empty h2{margin:0 0 8px;font-size:21px}
.empty p{color:var(--muted);margin:0 auto 20px;max-width:540px}
.comparison{width:100%;border-collapse:collapse;min-width:700px}
.comparison th{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);font-size:11px;color:#6e8693;text-transform:uppercase;letter-spacing:.6px;white-space:nowrap}
.comparison td{padding:16px 14px;border-bottom:1px solid #edf1f3;vertical-align:middle;font-size:12px}
.comparison tbody tr:hover{background:#f6fafb}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px;background:white}
.comparison td strong{display:block;font-size:13px}
.comparison td small{display:block;color:var(--muted);line-height:1.5}
.line-total{font-weight:800;color:#075f68;font-variant-numeric:tabular-nums;font-size:14px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.report-preview{background:#fff;border:1px solid var(--line);border-radius:13px;padding:25px;margin:20px 0}
.report-preview h2{margin:0;font-size:20px}
.report-preview h3{font-size:15px;margin:25px 0 8px;border-bottom:1px solid #e8edef;padding-bottom:7px}
.report-preview p{margin:6px 0;font-size:12px}
.report-preview table{width:100%;border-collapse:collapse;font-size:12px}
.report-preview th,.report-preview td{text-align:left;padding:8px 6px;border-bottom:1px solid #edf1f3;vertical-align:top}
.report-preview th{color:#667d89;font-size:11px}
.report-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0}
.report-summary>div{padding:14px;background:#f5f9fa;border-radius:10px}
.report-summary span{display:block;font-size:10px;color:#647b8b}
.report-summary strong{font-size:20px}
.report-break{page-break-before:always;break-before:page}
.linklist a{word-break:break-all}
.footer{margin-top:33px;text-align:center;color:#8b9eaa;font-size:11px}
.toast{position:fixed;right:25px;bottom:22px;z-index:9000;max-width:min(400px,calc(100vw - 40px));border-radius:13px;background:#1c4352;color:#fff;box-shadow:0 15px 40px rgba(6,32,45,.2);padding:13px 18px;font-size:13px;transition:opacity .2s}
.toast.hidden{pointer-events:none;opacity:0}
.print-area{display:none}
.report-url{word-break:break-all;overflow-wrap:anywhere;font-size:10px}
.date-fallback,.bulk-cities{border-top:1px solid #e6ecee;padding-top:11px;margin-top:14px}
.date-fallback summary,.bulk-cities summary{cursor:pointer;color:#577485;font-weight:650;font-size:12px}
.noscript{padding:16px;background:#fff1df;color:#804d09;text-align:center}
@media(max-width:1180px){.layout{grid-template-columns:minmax(0,1fr)}.summary{position:static;order:1}.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.form-grid.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:780px){.app{display:block}.side{height:auto;min-height:0;position:static;padding:13px;max-height:none}.brand{margin:0 6px 11px}.nav-group,.sidebottom,.sidehint,.route-nav-list{display:none}.sidebar-main{display:flex;gap:6px;overflow:auto}.sidebtn{width:auto;flex:none;white-space:nowrap}.topbar{align-items:start;flex-direction:column;gap:12px;padding:17px}.content{padding:17px 12px 52px}.card.pad{padding:16px}.stat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.citytop{grid-template-columns:1fr}.form-grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}.topbar-title h1{font-size:20px}}
@media(max-width:480px){.form-grid,.form-grid.three,.form-grid.four{grid-template-columns:1fr}.stat-grid{grid-template-columns:1fr 1fr}.stat{padding:13px}.stat strong{font-size:20px}.citycard{padding:10px;gap:7px}.draghandle{display:none}.report-summary{grid-template-columns:1fr}.top-actions{justify-content:start}}
@media print{
 @page{size:A4;margin:13mm 12mm}
 body{background:white;color:black;font-size:10px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
 .app,.toast,.footer{display:none!important}
 .print-area{display:block!important}
 .report-preview{border:0;padding:0;margin:0;border-radius:0}
 .report-preview h2{font-size:18px}
 .report-preview h3{font-size:12px;margin:14px 0 6px}
 .report-preview p,.report-preview table{font-size:9px}
 .report-preview th,.report-preview td{font-size:9px;padding:5px 4px;word-break:break-word;overflow-wrap:anywhere}
 .report-preview tr,.report-preview h3,.report-summary>div{break-inside:avoid;page-break-inside:avoid}
 .report-preview h3{break-after:avoid;page-break-after:avoid}
 .report-url{overflow-wrap:anywhere;word-break:break-all}
 .report-break{break-before:page;page-break-before:always}
 .report-summary>div{padding:8px}
 .report-summary strong{font-size:15px}
 .report-break{page-break-before:always;break-before:page}
 a{color:#154f61;text-decoration:none}
}
</style>
</head>
<body>
<noscript><div class="noscript">Ative o JavaScript para usar esta ferramenta. Os dados são guardados localmente no navegador e podem ser copiados em JSON.</div></noscript>
<div class="app">
 <aside class="side">
  <div class="brand"><div class="mark">↗</div><div><strong>Rota Clara</strong><small>Seus roteiros e cotações</small></div></div>
  <div class="sidebar-main">
   <button type="button" class="sidebtn" data-action="go" data-screen="dashboard">◫ &nbsp; Comparar roteiros</button>
   <button type="button" class="sidebtn" data-action="go" data-screen="editor">◇ &nbsp; Planejar</button>
   <button type="button" class="sidebtn" data-action="go" data-screen="report">▤ &nbsp; Relatórios</button>
  </div>
  <div class="nav-group">Meus roteiros <span class="sidecount" id="routeCount">0</span></div>
  <div id="routeNav" class="route-nav-list"></div>
  <div class="sidebottom">
   <button type="button" class="sidebtn" data-action="newRoute">＋ &nbsp; Novo roteiro</button>
   <button type="button" class="sidebtn" data-action="loadPresets">⊞ &nbsp; Adicionar 22 ideias</button>
   <button type="button" class="sidebtn" data-action="exportJson">⇩ &nbsp; Backup JSON</button>
   <button type="button" class="sidebtn" data-action="importJson">⇧ &nbsp; Restaurar backup</button>
   <p class="sidehint">Salvamento automático neste navegador. Exporte um backup JSON periodicamente para não depender de apenas um dispositivo.</p>
  </div>
 </aside>
 <main class="main">
  <header class="topbar"><div class="topbar-title" id="pageTitle"></div><div class="top-actions" id="topActions"></div></header>
  <div class="content" id="content"></div>
 </main>
</div>
<div class="print-area" id="printArea"></div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="fileImport" accept=".json,application/json" hidden>
<datalist id="airports"><option value="NTE">Nantes — NTE</option><option value="CDG">Paris CDG</option><option value="ORY">Paris Orly</option><option value="BVA">Paris Beauvais</option><option value="MUC">Munique</option><option value="ZAG">Zagreb</option><option value="LJU">Liubliana</option><option value="OTP">Bucareste</option><option value="RIX">Riga</option><option value="TLL">Tallinn</option><option value="BGY">Bergamo</option></datalist>
<script>
'use strict';
/* ROTA CLARA — Edição pontual: hospedagem de grupo, extras por categoria e geo de aeroportos. */
const STORE='rota-clara-v1'; // manter chave: preservar pesquisas de versões anteriores
const DATA_VERSION=2;
const DEFAULT_START='2026-12-24';
const DEFAULT_END='2027-01-02';
const moneyFormatter=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'EUR'});
const PRESETS=[
 ['Zagreb → Liubliana → Salzburgo → Innsbruck',['Zagreb','Liubliana','Salzburgo','Innsbruck']],
 ['Zagreb → Liubliana',['Zagreb','Liubliana']],
 ['Salzburgo + Munique',['Salzburgo','Munique']],
 ['Vilnius → Riga → Tallinn',['Vilnius','Riga','Tallinn']],
 ['Cluj-Napoca → Sibiu → Brașov → Bucareste',['Cluj-Napoca','Sibiu','Brașov','Bucareste']],
 ['Brașov → Sinaia → Bran → Bucareste',['Brașov','Sinaia','Bran','Bucareste']],
 ['Brașov + Bucareste',['Brașov','Bucareste']],
 ['Sibiu → Brașov → Bucareste',['Sibiu','Brașov','Bucareste']],
 ['Nuremberg → Munique → Salzburgo → Innsbruck',['Nuremberg','Munique','Salzburgo','Innsbruck']],
 ['Innsbruck → Merano → Bolzano → Trento',['Innsbruck','Merano','Bolzano','Trento']],
 ['Innsbruck + Trento',['Innsbruck','Trento']],
 ['Salzburgo + Zagreb',['Salzburgo','Zagreb']],
 ['Salzburgo + Liubliana',['Salzburgo','Liubliana']],
 ['Munique → Frankfurt → Nuremberg → Stuttgart',['Munique','Frankfurt','Nuremberg','Stuttgart']],
 ['Salzburgo → Liubliana → Zagreb',['Salzburgo','Liubliana','Zagreb']],
 ['Innsbruck → Salzburgo → Liubliana → Zagreb',['Innsbruck','Salzburgo','Liubliana','Zagreb']],
 ['Bergamo → Trento → Bolzano → Merano',['Bergamo','Trento','Bolzano','Merano']],
 ['Riga + Tallinn',['Riga','Tallinn']],
 ['Dresden → Görlitz → Wrocław → Karpacz',['Dresden','Görlitz','Wrocław','Karpacz']],
 ['Baden-Baden → Freiburg → Titisee → Heidelberg',['Baden-Baden','Freiburg','Titisee','Heidelberg']],
 ['Košice → Poprad → Starý Smokovec → Štrbské Pleso',['Košice','Poprad','Starý Smokovec','Štrbské Pleso']],
 ['Sibiu + Brașov',['Sibiu','Brașov']]
];
let state={version:DATA_VERSION,groupSize:5,screen:'dashboard',activeId:null,editorTab:'cities',routes:[]};
let dragCity=null;
let toastTimer=null;
let savingTimer=null;
let geoTarget=null;
let printBusy=false;
const $=sel=>document.querySelector(sel);
const $$=sel=>Array.from(document.querySelectorAll(sel));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
function esc(v){return String(v??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function money(v){return moneyFormatter.format(Number(v)||0);}
function hasNum(v){return v!==null&&v!==undefined&&v!==''&&Number.isFinite(Number(v))&&Number(v)>=0;}
function num(v){return hasNum(v)?Number(v):0;}
function parsedAmount(v){if(v===null||v===undefined||String(v).trim()==='')return '';const n=Number(String(v).replace(',','.'));return Number.isFinite(n)&&n>=0?n:'';}
function datePart(s){return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}/.test(s)?s.slice(0,10):'';}
function daysBetween(a,b){if(!a||!b)return null;const x=Date.parse(a+'T12:00:00Z'),y=Date.parse(b+'T12:00:00Z');return Number.isFinite(x)&&Number.isFinite(y)?Math.round((y-x)/86400000):null;}
function addDays(a,n){const d=new Date(a+'T12:00:00Z');if(!Number.isFinite(d.getTime()))return '';d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function fmtDate(d){if(!d)return 'Data pendente';const x=new Date(datePart(d)+'T12:00:00Z');if(Number.isNaN(x.getTime()))return 'Data inválida';return new Intl.DateTimeFormat('pt-BR',{timeZone:'UTC',weekday:'short',day:'2-digit',month:'2-digit',year:'numeric'}).format(x).replace(/\./g,'');}
function fmtStamp(s){if(!s)return 'Não informado';const d=datePart(s);const t=s.length>=16?' · '+s.slice(11,16):'';return fmtDate(d)+t;}
function safeUrl(v){if(!v)return '';try{const x=new URL(String(v).trim());return ['https:','http:'].includes(x.protocol)?x.href:''}catch{return ''}}
function link(v,label='Abrir link ↗'){const x=safeUrl(v);return x?`<a href="${esc(x)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>`:'';}
// O valor armazenado de uma hospedagem é sempre o TOTAL DO APARTAMENTO para o grupo.
function hotelPersonPrice(q){return q&&hasNum(q.price)?num(q.price)/state.groupSize:0;}
function pricePerPersonExtra(x){return hasNum(x.price)?num(x.price)/(x.basis==='group'?state.groupSize:1):0;}
function extraGroupPrice(x){return hasNum(x.price)?num(x.price)*(x.basis==='group'?1:state.groupSize):0;}
function extraCategory(x){return EXTRA_CATEGORIES.find(y=>y.id===(x.category||'outro'))||EXTRA_CATEGORIES[EXTRA_CATEGORIES.length-1];}
const EXTRA_CATEGORIES=[
 {id:'alimentacao',label:'Alimentação / restaurante'},

 {id:'aeroporto',label:'Transfer aeroporto / estação'},

 {id:'passeio',label:'Passeios e atividades'},
 {id:'bagagem',label:'Bagagem'},
 {id:'seguro',label:'Seguro de viagem'},

 {id:'taxa',label:'Taxas e tarifas'},
 {id:'outro',label:'Outros gastos'}

const EXTRA_TRANSPORT_MODES=['Ônibus','Trem','Avião','BlaBlaCar','Metrô','Tram','Táxi / Uber','Barco / ferry','Outro'];
function airportGeoUrl(geo){if(!geo||!Number.isFinite(Number(geo.lat))||!Number.isFinite(Number(geo.lon)))return '';const lat=Number(geo.lat),lon=Number(geo.lon);return `https://www.openstreetmap.org/?mlat=${encodeURIComponent(lat)}&mlon=${encodeURIComponent(lon)}#map=14/${encodeURIComponent(lat)}/${encodeURIComponent(lon)}`;}
function airportGeoLabel(q,side){const geo=q?.[side+'Geo'];return geo?.label||'';}
function airportGeoInfo(q,side){const geo=q?.[side+'Geo'];return geo?.label?`${geo.label} (${Number(geo.lat).toFixed(5)}, ${Number(geo.lon).toFixed(5)})`:'';}
// Nomes são apenas dicas para a pesquisa, nunca coordenadas presumidas.
const AIRPORT_HINTS={NTE:'Aéroport Nantes Atlantique',CDG:'Aéroport Paris Charles de Gaulle',ORY:'Aéroport Paris Orly',BVA:'Aéroport Beauvais Tillé',ZAG:'Zagreb Franjo Tuđman Airport',LJU:'Ljubljana Jože Pučnik Airport',MUC:'Flughafen München',SZG:'Salzburg Airport W. A. Mozart',INN:'Flughafen Innsbruck',VIE:'Vienna International Airport',BGY:'Milan Bergamo Airport Orio al Serio',VRN:'Verona Villafranca Airport',OTP:'Henri Coandă International Airport Bucharest',CLJ:'Avram Iancu Cluj International Airport',SBZ:'Sibiu International Airport',RIX:'Riga International Airport',TLL:'Tallinn Airport',VNO:'Vilnius International Airport',KRK:'Kraków John Paul II International Airport',WRO:'Copernicus Airport Wrocław',BER:'Berlin Brandenburg Airport',FRA:'Frankfurt Airport',STR:'Stuttgart Airport',FKB:'Karlsruhe Baden-Baden Airport',BSL:'EuroAirport Basel Mulhouse Freiburg',MLH:'EuroAirport Basel Mulhouse Freiburg',EDI:'Edinburgh Airport',SOF:'Sofia Airport',TRN:'Turin Caselle Airport',KSC:'Košice International Airport'};
function upgradeData(data){
 if(Number(data?.version||1)>=DATA_VERSION)return data;
 // Backup antigo: preço de hotel era por pessoa. Converter uma única vez.
 const people=Number(data.groupSize)>0?Number(data.groupSize):5;
 for(const r of data.routes||[])for(const stay of Object.values(r.stays||{}))for(const q of stay?.offers||[]){if(hasNum(q.price))q.price=+(num(q.price)*people).toFixed(2);}
 data.version=DATA_VERSION;
 return data;
}

function textField(label,value,attrs='',placeholder=''){return `<div class="form-field"><label>${esc(label)}</label><input ${attrs} value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`;}
function dateField(label,value,attrs='',type='date'){return textField(label,value,`type="${type}" ${attrs}`);}
function areaField(label,value,attrs='',placeholder=''){return `<div class="form-field"><label>${esc(label)}</label><textarea ${attrs} placeholder="${esc(placeholder)}">${esc(value)}</textarea></div>`;}
function priceField(value,attrs='',label='Preço por pessoa (€)'){return textField(label,value,`type="number" min="0" step="0.01" inputmode="decimal" ${attrs}`,'Ex.: 49,90');}
function createQuote(type){return {id:uid(),vendor:'',mode:type==='leg'?'Ônibus':'',from:'',to:'',fromGeo:null,toGeo:null,depart:'',arrive:'',price:'',url:'',note:''};}
function createBucket(type){const x=createQuote(type);return {selected:x.id,offers:[x]};}
function createCity(name){return {id:uid(),name:name||'',country:'',lat:null,lon:null,geoLabel:''};}
function makeStay(){const q={id:uid(),name:'',price:'',url:'',note:''};return {selected:q.id,offers:[q],checkinOverride:'',checkoutOverride:''};}
function createLeg(fromId,toId,swapDate=''){return {id:uid(),fromId,toId,swapDate,swapAuto:true,...createBucket('leg')};}
function newRoute(title='',names=[]){const id=uid(),cities=names.map(createCity);const r={id,title:title||'Novo roteiro',notes:'',start:DEFAULT_START,end:DEFAULT_END,cities,flights:{out:createBucket('flight'),back:createBucket('flight')},legs:[],legArchive:{},stays:{},extras:[]};for(const c of cities)r.stays[c.id]=makeStay();syncLegs(r);return r;}
function chooseBucket(b){return b&&b.offers?.find(x=>x.id===b.selected)||null;}
function activeRoute(){return state.routes.find(r=>r.id===state.activeId)||null;}
function getLegKey(a,b){return a+'::'+b;}
function syncLegs(r){
 const old=new Map((r.legs||[]).map(l=>[getLegKey(l.fromId,l.toId),l]));
 for(const l of r.legs||[])r.legArchive[getLegKey(l.fromId,l.toId)]=l;
 const totalDays=daysBetween(r.start,r.end)||9;
 r.legs=r.cities.slice(0,-1).map((c,i)=>{
  const next=r.cities[i+1];const key=getLegKey(c.id,next.id);
  const suggestion=addDays(r.start,Math.round((i+1)*totalDays/r.cities.length));
  const leg=old.get(key)||r.legArchive[key]||createLeg(c.id,next.id,suggestion);
  if(leg.swapAuto===true)leg.swapDate=suggestion;
  return leg;
 });
}
function findStay(r,cityId){if(!r.stays[cityId])r.stays[cityId]=makeStay();return r.stays[cityId];}
function cityName(r,id){return r.cities.find(c=>c.id===id)?.name||'Cidade';}
function computeStays(r){
 const out=chooseBucket(r.flights.out),back=chooseBucket(r.flights.back);
 const first=datePart(out?.arrive)||r.start;
 const last=datePart(back?.depart)||r.end;
 const entries=[];
 for(let i=0;i<r.cities.length;i++){
  const c=r.cities[i],s=findStay(r,c.id);
  const prev=i? r.legs[i-1]:null,next=i<r.legs.length?r.legs[i]:null;
  const entering=prev?(datePart(chooseBucket(prev)?.arrive)||datePart(chooseBucket(prev)?.depart)||prev.swapDate):first;
  const leaving=next?(datePart(chooseBucket(next)?.depart)||next.swapDate):last;
  const start=s.checkinOverride||entering,end=s.checkoutOverride||leaving;
  const nights=daysBetween(start,end);
  const chosen=chooseBucket(s);
  entries.push({city:c,stay:s,offer:chosen,start,end,nights});
 }
 return entries;
}
function checkRoute(r){
 const issues=[],stays=computeStays(r),out=chooseBucket(r.flights.out),back=chooseBucket(r.flights.back);
 if(r.cities.length===0)issues.push('Nenhuma cidade cadastrada.');
 if(r.cities.some(c=>!c.name.trim()))issues.push('Há uma cidade sem nome.');
 if(!out||!hasNum(out.price))issues.push('Preço de voo de ida pendente.');
 if(!back||!hasNum(back.price))issues.push('Preço de voo de volta pendente.');
 if(!out?.depart||!out?.arrive)issues.push('Data e horário completos do voo de ida pendentes.');
 if(!back?.depart||!back?.arrive)issues.push('Data e horário completos do voo de volta pendentes.');
 if(out?.depart&&out?.arrive&&out.arrive<out.depart)issues.push('Chegada de ida anterior à partida; confira os fusos e datas.');
 if(back?.depart&&back?.arrive&&back.arrive<back.depart)issues.push('Chegada de volta anterior à partida; confira os fusos e datas.');
 for(const l of r.legs){const q=chooseBucket(l),pair=`${cityName(r,l.fromId)} → ${cityName(r,l.toId)}`;
  if(!q||!hasNum(q.price))issues.push(`Transporte ${pair}: preço pendente.`);
  if(!q?.depart)issues.push(`Transporte ${pair}: data e hora de saída pendentes.`);
  if(q?.depart&&q?.arrive&&q.arrive<q.depart)issues.push(`Transporte ${pair}: chegada anterior à partida.`);
 }
 for(const s of stays){
  if(!s.offer||!hasNum(s.offer.price))issues.push(`Hotel em ${s.city.name}: preço total da hospedagem pendente.`);
  if(s.nights===null)issues.push(`Hotel em ${s.city.name}: faltam datas.`);
  if(s.nights!==null&&s.nights<=0)issues.push(`Hotel em ${s.city.name}: ${s.nights} noites. Corrija as datas.`);
 }
 for(let i=0;i<stays.length-1;i++){
  const a=stays[i],b=stays[i+1],difference=daysBetween(a.end,b.start);
  if(difference!==null&&difference!==0)issues.push(`${a.city.name} → ${b.city.name}: ${difference>0?difference+' dia(s) sem hospedagem':'datas de hotéis sobrepostas ('+Math.abs(difference)+' dia(s))'}. Confira transporte noturno e check-in.`);
 }
 const trip=daysBetween(datePart(out?.depart)||r.start,datePart(back?.arrive)||r.end);
 if(trip!==null&&trip+1>10)issues.push(`A viagem ocupa ${trip+1} dias, acima do limite desejado de 10.`);
 if(trip!==null&&trip<0)issues.push('A volta está antes da ida.');
 for(const x of r.extras){if((x.name||'').trim()&&!hasNum(x.price))issues.push(`Extra "${x.name}": valor pendente.`);if(['transporte','aeroporto'].includes(x.category)&&x.depart&&x.arrive&&x.arrive<x.depart)issues.push(`Transporte extra "${x.name||'sem nome'}": chegada anterior à saída; confira fuso e datas.`);}
 return issues;
}
function compute(r){
 let flight=0,transport=0,hotels=0,extras=0;
 const out=chooseBucket(r.flights.out),back=chooseBucket(r.flights.back);
 for(const q of [out,back])if(q&&hasNum(q.price))flight+=num(q.price);
 for(const l of r.legs){const q=chooseBucket(l);if(q&&hasNum(q.price))transport+=num(q.price)}
 for(const s of computeStays(r)){const q=s.offer;if(q&&hasNum(q.price))hotels+=hotelPersonPrice(q)}
 for(const x of r.extras)extras+=pricePerPersonExtra(x);
 const issues=checkRoute(r),total=flight+transport+hotels+extras;
 const pricingComplete=!!r.cities.length && !!out && !!back && hasNum(out.price)&&hasNum(back.price) && r.legs.every(l=>hasNum(chooseBucket(l)?.price)) && computeStays(r).every(s=>hasNum(s.offer?.price));
 const timelineComplete=!!out?.depart&&!!out?.arrive&&!!back?.depart&&!!back?.arrive&&r.legs.every(l=>!!chooseBucket(l)?.depart)&&computeStays(r).every(s=>s.nights>0);
 return {flight,transport,hotels,extras,total,groupTotal:total*state.groupSize,issues,pricingComplete,timelineComplete,complete:pricingComplete&&timelineComplete&&issues.length===0};
}
function save(){clearTimeout(savingTimer);savingTimer=setTimeout(()=>{try{localStorage.setItem(STORE,JSON.stringify({version:DATA_VERSION,groupSize:state.groupSize,screen:state.screen,activeId:state.activeId,editorTab:state.editorTab,routes:state.routes}));$('#savedAt').textContent='Salvo automaticamente';}catch(e){showToast('Falha ao salvar no navegador. Exporte um backup JSON.')}},100);}
function load(){try{const raw=localStorage.getItem(STORE);if(!raw)return;const s=JSON.parse(raw);if(!s||!Array.isArray(s.routes))return;upgradeData(s);state={...state,...s};state.groupSize=Number.isFinite(+s.groupSize)&&+s.groupSize>0?Math.min(30,+s.groupSize):5;state.routes=state.routes.filter(r=>r&&Array.isArray(r.cities)).map(r=>{
 r.flights=r.flights||{out:createBucket('flight'),back:createBucket('flight')};r.flights.out=r.flights.out||createBucket('flight');r.flights.back=r.flights.back||createBucket('flight');r.legs=r.legs||[];r.legArchive=r.legArchive||{};r.stays=r.stays||{};r.extras=r.extras||[];r.start=r.start||DEFAULT_START;r.end=r.end||DEFAULT_END;syncLegs(r);return r;});
 if(!state.routes.some(r=>r.id===state.activeId))state.activeId=state.routes[0]?.id||null;
 if(!['dashboard','editor','report'].includes(state.screen))state.screen='dashboard';
 if(!['cities','flights','transfers','hotels','extras'].includes(state.editorTab))state.editorTab='cities';
 }catch(e){showToast('Não foi possível ler os dados guardados.');}}
function showToast(s){const el=$('#toast');el.textContent=s;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3600)}
function updateNav(){

}
function render(){updateNav();const r=activeRoute();
 const headings={dashboard:['Comparar roteiros','Veja custos por pessoa, incompletudes e melhores combinações.'],editor:[r?r.title:'Novo planejamento','Registre somente as ofertas que você encontrar; a ferramenta organiza e soma os valores.'],report:['Relatórios e exportações','Envie um resumo claro para os outros quatro viajantes.']};
 const [title,subtitle]=headings[state.screen];$('#pageTitle').innerHTML=`<h1>${esc(title)}</h1><p>${esc(subtitle)} · <span id="savedAt">Salvo automaticamente</span></p>`;
 $('#topActions').innerHTML=`<span class="pill light">${state.groupSize} viajantes</span><button class="btn secondary small" data-action="newRoute">＋ Novo</button><button class="btn secondary small" data-action="exportJson">⇩ Backup</button>`;
 $('#content').innerHTML=state.screen==='dashboard'?renderDashboard():state.screen==='editor'?renderEditor():renderReports();
}
function renderDashboard(){
 const routes=state.routes.map(r=>({r,c:compute(r)}));
 const complete=routes.filter(x=>x.c.complete).sort((a,b)=>a.c.total-b.c.total);
 const ordered=[...complete,...routes.filter(x=>!x.c.complete).sort((a,b)=>a.r.title.localeCompare(b.r.title))];
 if(!routes.length)return `<div class="empty"><div class="symbol">🧭</div><h2>Compare seus roteiros em um só lugar</h2><p>Cadastre as cidades, voos, ônibus, hotéis e preços. O sistema calcula automaticamente os gastos por pessoa e para todo o grupo, com avisos quando faltam dados.</p><div class="toolbar" style="justify-content:center"><button class="btn" data-action="newRoute">＋ Criar meu primeiro roteiro</button><button class="btn secondary" data-action="loadPresets">Adicionar as 22 ideias de roteiros</button></div></div><div class="footer">Rota Clara · Seus dados ficam neste navegador · Faça backups JSON regularmente.</div>`;
 const lowest=complete[0];
 return `<div class="stat-grid">
  <div class="stat"><div class="label">Roteiros cadastrados</div><strong>${routes.length}</strong><small>Possíveis viagens</small></div>
  <div class="stat"><div class="label">Prontos para comparar</div><strong>${complete.length}</strong><small>Com preços e datas validados</small></div>
  <div class="stat"><div class="label">Menor total validado</div><strong>${lowest?money(lowest.c.total):'—'}</strong><small>${lowest?esc(lowest.r.title):'Complete preços e horários'}</small></div>
  <div class="stat"><div class="label">Pessoas no grupo</div><strong>${state.groupSize}</strong><small>Valor ajustável abaixo</small></div>
 </div>
 <div class="section-heading"><div><h2>Comparativo de roteiros</h2><p>Roteiros completos primeiro, ordenados pelo menor preço por pessoa. Roteiros parciais não são classificados como mais baratos.</p></div><div class="toolbar"><button class="btn small" data-action="newRoute">＋ Novo roteiro</button><button class="btn secondary small" data-action="go" data-screen="report">Exportar</button></div></div>
 <div class="tablewrap"><table class="comparison"><thead><tr><th>Roteiro</th><th>Voos</th><th>Transportes</th><th>Hospedagem</th><th>Extras</th><th>Por pessoa</th><th>Situação</th><th></th></tr></thead><tbody>${ordered.map(({r,c})=>`<tr><td><strong>${esc(r.title)}</strong><small>${esc(r.cities.map(c=>c.name).join(' → ')||'Sem cidades')}<br>${esc(fmtDate(r.start))} até ${esc(fmtDate(r.end))}</small></td><td>${money(c.flight)}</td><td>${money(c.transport)}</td><td>${money(c.hotels)}</td><td>${money(c.extras)}</td><td><div class="line-total">${money(c.total)}</div><small>Grupo: ${money(c.groupTotal)}</small></td><td><span class="pill ${c.complete?'good':'warn'}">${c.complete?'Completo':`Parcial · ${c.issues.length} avisos`}</span></td><td><button class="btn ghost small" data-action="openRoute" data-id="${r.id}">Abrir →</button></td></tr>`).join('')}</tbody></table></div>
 <div class="section-heading"><div><h2>Configurações gerais</h2><p>O número de viajantes divide o valor total dos hotéis e calcula o total das cotações individuais. Gastos extras também podem ser registrados para o grupo.</p></div></div>
 <div class="card pad" style="max-width:570px"><div class="form-grid">${textField('Quantidade de viajantes',state.groupSize,'type="number" min="1" max="30" data-kind="groupSize"')}<div class="form-field"><label>Datas de referência</label><div class="notice">Natal e Ano-Novo: cada roteiro pode ter suas próprias datas de início e fim.</div></div></div></div>
 <div class="footer">Valores incompletos são apenas somas parciais, nunca cotações confirmadas.</div>`;
}

 const tabs=[['cities','1 · Roteiro e cidades'],['flights','2 · Voos'],['transfers','3 · Transportes'],['hotels','4 · Hospedagens'],['extras','5 · Outros gastos']];
 return `<div class="layout"><div class="editor"><div class="card pad">
 <div class="between" style="align-items:start;flex-wrap:wrap"><div><span class="eyebrow">Planejamento ativo</span><h2 class="headline">${esc(r.title)}</h2><span class="micro">Altere os campos; tudo é salvo automaticamente</span></div><button class="btn danger tiny" data-action="deleteRoute">Excluir roteiro</button></div>
 <div class="form-grid" style="margin-top:18px">${textField('Nome do roteiro',r.title,'data-kind="route" data-prop="title"')}${textField('Quantidade de cidades',r.cities.length,'disabled')}</div>
 <div class="form-grid" style="margin-top:12px">${dateField('Início planejado (referência)',r.start,'data-kind="route" data-prop="start"')}${dateField('Fim planejado / check-out',r.end,'data-kind="route" data-prop="end"')}</div>
 <p class="micro">As datas de chegada do voo e dos deslocamentos, quando informadas, ajustam automaticamente as noites. As datas de referência são usadas enquanto os bilhetes ainda não estão completos.</p>

function renderCities(r){return `<div class="section-heading" style="margin-top:0"><div><h2>Ordem das cidades</h2><p>Qualquer cidade pode ser digitada por você, mesmo fora das 22 ideias. Arraste os cartões ou use ↑ ↓.</p></div></div>

 <div class="notice" style="margin-top:14px">📍 <strong>Localização:</strong> clique em <strong>Localizar</strong> em qualquer cidade, escolha a correspondência correta do OpenStreetMap e guarde as coordenadas exatas. Só essa pesquisa precisa de internet; preços e transportes são digitados por você.</div>
 ${areaField('Notas gerais do roteiro',r.notes,'data-kind="route" data-prop="notes"','Ideias de passeio, feriados, detalhes importantes...')}`;

function renderCityCard(r,c,i){const osm=c.lat!==null&&c.lon!==null?`https://www.openstreetmap.org/?mlat=${encodeURIComponent(c.lat)}&mlon=${encodeURIComponent(c.lon)}#map=11/${encodeURIComponent(c.lat)}/${encodeURIComponent(c.lon)}`:`https://www.openstreetmap.org/search?query=${encodeURIComponent(c.name)}`;

function renderBucket(bucket,dir,title,subtitle){return `<div class="subcard"><div class="subcard-head"><div><h3>${esc(title)}</h3><p>${esc(subtitle)}</p></div><button class="btn secondary small" data-action="addQuote" data-type="flight" data-dir="${dir}">＋ Adicionar opção</button></div>${bucket.offers.map((q,i)=>renderQuote(q,{kind:'flight',dir,selected:bucket.selected===q.id,i})).join('')}</div>`;}
function quoteBind(ctx,q,prop){return `data-kind="${ctx.kind}" ${ctx.dir?`data-dir="${ctx.dir}"`:''} ${ctx.leg?`data-leg="${ctx.leg}"`:''} data-id="${q.id}" data-prop="${prop}"`;}
function renderQuote(q,ctx){
 const chosen=ctx.selected,flight=ctx.kind==='flight';

 <button class="btn ${chosen?'secondary':'ghost'} tiny" data-action="chooseQuote" data-type="${ctx.kind}" ${ctx.dir?`data-dir="${ctx.dir}"`:''} ${ctx.leg?`data-leg="${ctx.leg}"`:''} data-id="${q.id}">${chosen?'Escolhida':'Escolher'}</button>
 <button class="btn danger tiny" data-action="removeQuote" data-type="${ctx.kind}" ${ctx.dir?`data-dir="${ctx.dir}"`:''} ${ctx.leg?`data-leg="${ctx.leg}"`:''} data-id="${q.id}">Excluir</button></div></div>
 ${flight?`<div class="form-grid three">

 </div>
 <div class="form-grid" style="margin-top:8px">
 ${['from','to'].map(side=>`<div class="form-field"><div class="toolbar"><button class="btn ghost tiny" data-action="findAirport" data-dir="${ctx.dir}" data-id="${q.id}" data-side="${side}">⌖ Localizar aeroporto de ${side==='from'?'saída':'chegada'}</button>${q[side+'Geo']?.label?`<span class="pill good">✓ Localizado</span>`:''}</div>${q[side+'Geo']?.label?`<span class="micro">${esc(airportGeoInfo(q,side))} · ${link(airportGeoUrl(q[side+'Geo']),'Ver mapa ↗')}</span>`:'<span class="micro">Pesquise o aeroporto para salvar a localização exata no mapa.</span>'}<div class="geores" id="geo-airport-${side}-${q.id}"></div></div>`).join('')}
 </div>`:`<div class="form-grid three">
 <div class="form-field"><label>Tipo de transporte</label><select ${quoteBind(ctx,q,'mode')}>${modeOptions.map(m=>`<option value="${esc(m)}" ${modeValue===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div>
 ${textField('Empresa / operadora',q.vendor,quoteBind(ctx,q,'vendor'),'Ex.: FlixBus, Trenitalia, ÖBB')}
 ${priceField(q.price,quoteBind(ctx,q,'price'),'Preço por pessoa (€)')}
 </div>`}
 <div class="form-grid" style="margin-top:11px">
 ${dateField('Saída · data e hora',q.depart,quoteBind(ctx,q,'depart'),'datetime-local')}
 ${dateField(flight?'Chegada · data e hora':'Chegada · se souber (opcional)',q.arrive,quoteBind(ctx,q,'arrive'),'datetime-local')}
 </div>
 <div style="margin-top:11px">${textField('Link da oferta',q.url,`type="url" ${quoteBind(ctx,q,'url')}`,'https://...')}
 ${q.url?`<div class="micro" style="margin-top:7px">${link(q.url,'Abrir a oferta ↗')}</div>`:''}</div>
 </div>`;
}

function renderHotels(r){const list=computeStays(r);if(!list.length)return '<div class="notice">Adicione cidades na aba 1 para cadastrar os hotéis.</div>';

}

function renderExtraCard(x){

 const categorySelect=`<div class="form-field"><label>Categoria</label><select ${b('category')}>${EXTRA_CATEGORIES.map(y=>`<option value="${y.id}" ${category===y.id?'selected':''}>${esc(y.label)}</option>`).join('')}</select></div>`;
 const basisSelect=`<div class="form-field"><label>Valor informado</label><select ${b('basis')}><option value="person" ${x.basis!=='group'?'selected':''}>Por pessoa</option><option value="group" ${x.basis==='group'?'selected':''}>Total do grupo</option></select></div>`;
 const total=hasNum(x.price)?`<strong>${money(pricePerPersonExtra(x))} por pessoa</strong> · ${money(extraGroupPrice(x))} para ${state.groupSize} pessoas`:'Preço ainda não informado';
 let specific='';
 if(category==='transporte'||category==='aeroporto'){

  <div class="form-grid three" style="margin-top:11px"><div class="form-field"><label>Tipo de transporte</label><select ${b('mode')}>${EXTRA_TRANSPORT_MODES.map(m=>`<option ${x.mode===m?'selected':''}>${esc(m)}</option>`).join('')}</select></div>${dateField('Saída · data e hora',x.depart||'',b('depart'),'datetime-local')}${dateField('Chegada · data e hora',x.arrive||'',b('arrive'),'datetime-local')}</div>`;
 }else if(category==='alimentacao'){
  specific=`<div class="form-grid three" style="margin-top:11px">${dateField('Data da refeição',x.date||'',b('date'))}<div class="form-field"><label>Tipo de refeição</label><select ${b('meal')}>${['Não definido','Café da manhã','Almoço','Jantar','Lanche / café','Compras de mercado'].map(t=>`<option ${x.meal===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>${textField('Local / restaurante (opcional)',x.place||'',b('place'),'Ex.: Restaurante, mercado')}</div>`;
 }else if(category==='ingresso'||category==='passeio'){
  specific=`<div class="form-grid three" style="margin-top:11px">${dateField('Data e hora',x.depart||'',b('depart'),'datetime-local')}${textField('Atração / lugar',x.place||'',b('place'),'Ex.: Castelo, museu, tour')}${textField('Fornecedor (opcional)',x.vendor||'',b('vendor'),'Ex.: Site oficial')}</div>`;

 }
 const label=category==='transporte'||category==='aeroporto'?'Trajeto / descrição':category==='alimentacao'?'Refeição / despesa':category==='ingresso'?'Ingresso / evento':category==='passeio'?'Passeio / atividade':'Descrição da despesa';
 return `<div class="subcard" data-extra-id="${x.id}">

function renderSummary(r){const c=compute(r),nights=computeStays(r).reduce((sum,x)=>sum+(x.nights>0?x.nights:0),0);return `<h3>Resumo em tempo real</h3><div class="between"><span class="micro">${r.cities.length} cidades · ${nights} noites planejadas</span><span class="pill ${c.complete?'good':'warn'}">${c.complete?'Validado':'Em construção'}</span></div><div style="margin-top:13px"><div class="sumrow"><span>Voos (ida + volta)</span><strong>${money(c.flight)}</strong></div><div class="sumrow"><span>Transporte entre cidades</span><strong>${money(c.transport)}</strong></div><div class="sumrow"><span>Hospedagens</span><strong>${money(c.hotels)}</strong></div><div class="sumrow"><span>Outros gastos</span><strong>${money(c.extras)}</strong></div></div><div class="sumtotal"><div class="over">Total por pessoa ${c.complete?'':'(parcial)'}</div><strong>${money(c.total)}</strong><div class="over" style="margin-top:7px">Total para ${state.groupSize}: <b>${money(c.groupTotal)}</b></div></div><div class="toolbar"><button class="btn small" data-action="print" data-mode="current">PDF do roteiro</button><button class="btn secondary small" data-action="txt" data-mode="current">TXT</button></div><hr class="divider"><h3 style="margin-bottom:8px">Pendências (${c.issues.length})</h3>${c.issues.length?`<div class="notice warn" style="max-height:300px;overflow:auto">${c.issues.slice(0,12).map(x=>'• '+esc(x)).join('<br>')}${c.issues.length>12?'<br>… e outras pendências':''}</div>`:'<div class="notice good">Tudo preenchido! Este roteiro pode ser comparado de forma confiável com outros roteiros completos.</div>'}<p class="micro" style="margin-top:11px">⚠ Preços faltantes não são zeros. Inclua custos de traslado do aeroporto e bagagem em “Outros gastos” quando necessário.</p>`;}
function renderReports(){const r=activeRoute();return `<div class="card pad"><div class="between" style="align-items:start;flex-wrap:wrap"><div><span class="eyebrow">Compartilhamento</span><h2 class="headline">Relatórios que seus amigos conseguem entender</h2><p class="muted">Resumo individual com voos, datas, noites, transportes, hotéis, links e total — ou comparação geral de todos os roteiros.</p></div></div><div class="toolbar" style="margin:18px 0"><button class="btn" data-action="print" data-mode="all">PDF · Todos</button><button class="btn secondary" data-action="print" data-mode="current" ${r?'':'disabled'}>PDF · Atual</button><button class="btn secondary" data-action="txt" data-mode="all">TXT · Todos</button><button class="btn secondary" data-action="txt" data-mode="current" ${r?'':'disabled'}>TXT · Atual</button><button class="btn ghost" data-action="exportJson">Backup editável JSON</button></div><div class="notice">Ao clicar em <strong>PDF</strong>, escolha <strong>Salvar como PDF</strong> na impressão do navegador (não precisa instalar nada). Os relatórios incluem horários, noites, valores por pessoa e para o grupo e <strong>URLs completos e clicáveis</strong>. O TXT é baixado imediatamente. Nenhuma cotação é pesquisada automaticamente.</div></div><div class="section-heading"><div><h2>Prévia do relatório</h2><p>${r?'Roteiro selecionado: '+esc(r.title):'Selecione ou crie um roteiro para a prévia detalhada.'}</p></div></div>${r?renderReportRoute(r,false):'<div class="empty">Nenhum roteiro selecionado.</div>'}`;}
function reportLink(v){const url=safeUrl(v);return url?`<a class="report-url" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(url)}</a>`:'—';}
function renderReportRoute(r,breakPage=false){const c=compute(r),stays=computeStays(r),out=chooseBucket(r.flights.out),back=chooseBucket(r.flights.back);
 const tableRows=[['Voos',c.flight],['Transporte entre cidades',c.transport],['Hospedagens',c.hotels],['Despesas adicionais',c.extras]];
 const flightRow=(q,title)=>`<tr><td><strong>${title}</strong></td><td>${esc(q?.from||'—')} → ${esc(q?.to||'—')}<br><small>${esc(fmtStamp(q?.depart))} → ${esc(fmtStamp(q?.arrive))}</small>${airportGeoLabel(q,'from')?`<br><small>📍 Origem: ${esc(airportGeoInfo(q,'from'))} · ${reportLink(airportGeoUrl(q.fromGeo))}</small>`:''}${airportGeoLabel(q,'to')?`<br><small>📍 Destino: ${esc(airportGeoInfo(q,'to'))} · ${reportLink(airportGeoUrl(q.toGeo))}</small>`:''}</td><td>${hasNum(q?.price)?money(q.price):'PENDENTE'}</td><td>${reportLink(q?.url)}</td></tr>`;
 return `<div class="report-preview ${breakPage?'report-break':''}"><div class="eyebrow">ROTA CLARA · RESUMO DE VIAGEM</div><h2>${esc(r.title)}</h2><p class="muted">${esc(r.cities.map(c=>c.name).join(' → ')||'Cidades pendentes')} · ${esc(fmtDate(r.start))} até ${esc(fmtDate(r.end))} · ${state.groupSize} pessoas</p><div class="report-summary"><div><span>Por pessoa ${c.complete?'':'· PARCIAL'}</span><strong>${money(c.total)}</strong></div><div><span>Grupo completo</span><strong>${money(c.groupTotal)}</strong></div><div><span>Status</span><strong style="font-size:13px">${c.complete?'Completo':`${c.issues.length} pendência(s)`}</strong></div></div>
 <h3>Resumo de custos</h3><table><thead><tr><th>Categoria</th><th>Por pessoa</th><th>Para ${state.groupSize} pessoas</th></tr></thead><tbody>${tableRows.map(([n,v])=>`<tr><td>${n}</td><td>${money(v)}</td><td>${money(v*state.groupSize)}</td></tr>`).join('')}<tr><td><strong>TOTAL ${c.complete?'':'(PARCIAL)'}</strong></td><td><strong>${money(c.total)}</strong></td><td><strong>${money(c.groupTotal)}</strong></td></tr></tbody></table>

function fullReportHtml(mode){
 const routes=mode==='current'?[activeRoute()].filter(Boolean):state.routes;
 if(!routes.length)return '<div class="report-preview"><h2>Nenhum roteiro cadastrado.</h2></div>';
 let index='';
 if(mode==='all'){
  const ranked=routes.map(r=>({r,c:compute(r)})).sort((a,b)=>(Number(b.c.complete)-Number(a.c.complete))||(a.c.complete?a.c.total-b.c.total:a.r.title.localeCompare(b.r.title)));
  index=`<div class="report-preview"><div class="eyebrow">ROTA CLARA · COMPARAÇÃO</div><h2>Comparativo dos roteiros</h2><p>Viagem em grupo · ${state.groupSize} pessoas · Gerado em ${esc(new Date().toLocaleString('pt-BR'))}</p><p class="muted">Valores por pessoa em euros. Os totais parciais não podem ser usados para concluir qual viagem é mais barata.</p><table><thead><tr><th>Roteiro</th><th>Voos</th><th>Transportes</th><th>Hotéis</th><th>Extras</th><th>Por pessoa</th><th>Grupo</th><th>Status</th></tr></thead><tbody>${ranked.map(({r,c})=>`<tr><td>${esc(r.title)}</td><td>${money(c.flight)}</td><td>${money(c.transport)}</td><td>${money(c.hotels)}</td><td>${money(c.extras)}</td><td><strong>${money(c.total)}</strong></td><td>${money(c.groupTotal)}</td><td>${c.complete?'COMPLETO':'PARCIAL'}</td></tr>`).join('')}</tbody></table></div>`;
 }
 return index+routes.map((r,i)=>renderReportRoute(r,mode==='all'||i>0)).join('');
}
function txtRoute(r){
 const c=compute(r),stays=computeStays(r),out=chooseBucket(r.flights.out),back=chooseBucket(r.flights.back);
 const outLines=[];
 const a=(s='')=>outLines.push(s);
 const line=()=>a('='.repeat(70));
 const qPrice=q=>hasNum(q?.price)?money(q.price):'PENDENTE';

  a('  Preço por pessoa: '+qPrice(q));
  if(q?.url)a('  Link: '+q.url);
  if(q?.note)a('  Observação: '+q.note);
 };
 line();a(r.title.toUpperCase());line();
 a('Cidades: '+r.cities.map(c=>c.name).join(' → '));
 a('Datas planejadas: '+fmtDate(r.start)+' até '+fmtDate(r.end));
 a('Viajantes: '+state.groupSize);
 a('Situação: '+(c.complete?'COMPLETO':'PARCIAL, '+c.issues.length+' pendências'));
 a('TOTAL POR PESSOA: '+money(c.total)+(c.complete?'':' (PARCIAL)'));
 a('TOTAL PARA O GRUPO: '+money(c.groupTotal));a();
 a('RESUMO DE CUSTOS');
 a('  Voos: '+money(c.flight));a('  Entre cidades: '+money(c.transport));a('  Hospedagens: '+money(c.hotels));a('  Outros gastos: '+money(c.extras));a();
 a('VOOS ESCOLHIDOS');qLine('Ida',out);qLine('Volta',back);a();
 a('TRANSPORTES ENTRE CIDADES');
 if(!r.legs.length)a('  Sem transferências entre cidades.');
 for(const l of r.legs){a('  '+cityName(r,l.fromId)+' → '+cityName(r,l.toId));
  const q=chooseBucket(l);a('  Tipo: '+(q?.mode||'—'));if(q?.vendor)a('  Empresa / operadora: '+q.vendor);
  a('  Saída: '+fmtStamp(q?.depart));a('  Chegada: '+fmtStamp(q?.arrive));
  a('  Preço por pessoa: '+qPrice(q));if(q?.url)a('  Link: '+q.url);if(q?.note)a('  Nota: '+q.note);a();
 }
 a('HOSPEDAGENS');
 if(!stays.length)a('  Nenhuma cidade.');
 for(const s of stays){a('  '+s.city.name+' | '+(s.offer?.name||'Hotel pendente'));
  a('  Check-in: '+fmtDate(s.start)+' | Check-out: '+fmtDate(s.end));
  a('  Noites: '+(s.nights===null?'PENDENTE':s.nights));
  a('  Total da hospedagem para o grupo (informado): '+qPrice(s.offer));
  a('  Total por pessoa (calculado): '+(hasNum(s.offer?.price)?money(hotelPersonPrice(s.offer)):'PENDENTE'));
  if(s.offer?.url)a('  Link: '+s.offer.url);if(s.offer?.note)a('  Nota: '+s.offer.note);a();
 }
 a('OUTROS GASTOS');
 if(!r.extras.length)a('  Nenhum gasto extra.');
 for(const x of r.extras){
  a('  ['+extraCategory(x).label+'] '+(x.name||'Sem nome'));
  if(['transporte','aeroporto'].includes(x.category)){
   a('  Origem → destino: '+(x.from||'?')+' → '+(x.to||'?'));
   a('  Tipo / operadora: '+[x.mode,x.vendor].filter(Boolean).join(' · '));
   a('  Saída: '+fmtStamp(x.depart));a('  Chegada: '+fmtStamp(x.arrive));
  }else if(['ingresso','passeio'].includes(x.category)){
   a('  Data e hora: '+fmtStamp(x.depart));
   if(x.place)a('  Lugar: '+x.place);if(x.vendor)a('  Fornecedor: '+x.vendor);
  }else{
   a('  Data: '+fmtDate(x.date));if(x.place)a('  Local: '+x.place);if(x.meal)a('  Refeição: '+x.meal);
  }
  a('  Preço informado ('+(x.basis==='group'?'grupo':'pessoa')+'): '+(hasNum(x.price)?money(x.price):'PENDENTE'));
  a('  Por pessoa: '+(hasNum(x.price)?money(pricePerPersonExtra(x)):'PENDENTE'));
  a('  Grupo: '+(hasNum(x.price)?money(extraGroupPrice(x)):'PENDENTE'));
  if(x.url)a('  Link: '+x.url);if(x.note)a('  Nota: '+x.note);a();
 }
 a();if(r.notes){a('NOTAS GERAIS');a(r.notes);a()}
 a('PENDÊNCIAS');if(c.issues.length)for(const x of c.issues)a('  - '+x);else a('  Nenhuma pendência detectada.');
 a();return outLines.join('\r\n');
}
function txtReport(mode){const list=mode==='current'?[activeRoute()].filter(Boolean):state.routes;let header=['ROTA CLARA — RELATÓRIO DE VIAGEM','Gerado: '+new Date().toLocaleString('pt-BR'),'Pessoas: '+state.groupSize,'Moeda: EUR','Valores são inseridos manualmente; resultados parciais não são cotações finais.',''];
 if(mode==='all'){
  header.push('COMPARATIVO GERAL','='.repeat(70));
  const ordered=list.map(r=>({r,c:compute(r)})).sort((a,b)=>(Number(b.c.complete)-Number(a.c.complete))||(a.c.complete?a.c.total-b.c.total:a.r.title.localeCompare(b.r.title)));
  for(const {r,c} of ordered)header.push(r.title+' | '+money(c.total)+' por pessoa | '+money(c.groupTotal)+' grupo | '+(c.complete?'COMPLETO':'PARCIAL'));
  header.push('');
 }
 return header.join('\r\n')+list.map(txtRoute).join('\r\n\r\n');
}
function downloadBlob(content,filename,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);}
function filenamePart(v){return String(v||'roteiro').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9_-]+/g,'-').replace(/^-|-$/g,'').slice(0,65)||'roteiro';}
function printReport(mode){if(printBusy)return;if(!state.routes.length){showToast('Cadastre pelo menos um roteiro.');return}if(mode==='current'&&!activeRoute()){showToast('Selecione um roteiro.');return}
 printBusy=true;$('#printArea').innerHTML=fullReportHtml(mode);
 const old=document.title;document.title=mode==='all'?'Rota Clara - Comparação geral':'Rota Clara - '+activeRoute().title;
 requestAnimationFrame(()=>{try{window.print()}finally{setTimeout(()=>{document.title=old;printBusy=false},1300)}});
}
function getBucketForAction(r,element){const type=element.dataset.type;
 if(type==='flight')return r.flights[element.dataset.dir];
 if(type==='leg')return r.legs.find(l=>l.id===element.dataset.leg)||null;
 if(type==='hotel')return findStay(r,element.dataset.city);
 return null;
}
function addCityToRoute(r,name){const c=createCity(name);r.cities.push(c);r.stays[c.id]=makeStay();syncLegs(r);}
function reorderCity(r,source,target){const i=r.cities.findIndex(c=>c.id===source),j=r.cities.findIndex(c=>c.id===target);if(i<0||j<0||i===j)return;const [removed]=r.cities.splice(i,1);r.cities.splice(j,0,removed);syncLegs(r);save();render();showToast('Ordem atualizada. Confira os novos trechos e as datas.');}
function refreshHotelVisuals(r){
 if(state.screen!=='editor'||state.editorTab!=='hotels')return;
 const rows=computeStays(r);
 for(let i=0;i<rows.length;i++){
  const s=rows[i],card=document.querySelector(`[data-staycity="${s.city.id}"]`);
  if(!card)continue;
  const period=card.querySelector('[data-stayperiod]');
  if(period)period.innerHTML=`<strong>${s.nights!==null&&s.nights>=0?s.nights+' noite(s)':'Datas pendentes'}</strong> · ${esc(fmtDate(s.start))} → ${esc(fmtDate(s.end))}`;
  const derived=card.querySelector('[data-stayderived]');
  const orig=i?(datePart(chooseBucket(r.legs[i-1])?.arrive)||datePart(chooseBucket(r.legs[i-1])?.depart)||r.legs[i-1].swapDate):(datePart(chooseBucket(r.flights.out)?.arrive)||r.start);
  const dest=i<r.legs.length?(datePart(chooseBucket(r.legs[i])?.depart)||r.legs[i].swapDate):(datePart(chooseBucket(r.flights.back)?.depart)||r.end);
  if(derived)derived.textContent='Se deixar vazio, serão usados automaticamente '+fmtDate(orig)+' e '+fmtDate(dest)+'.';
  for(const q of s.stay.offers){const pricebox=Array.from(card.querySelectorAll('[data-hotelquote]')).find(x=>x.dataset.hotelquote===q.id);
   if(!pricebox)continue;
   pricebox.innerHTML=hasNum(q.price)?`<strong>${money(q.price)}</strong> · Total da hospedagem para o grupo · <strong>${money(hotelPersonPrice(q))}</strong> por pessoa${s.nights>0?' · '+money(hotelPersonPrice(q)/s.nights)+' por pessoa/noite (referência)':''}`:'Informe o preço total da hospedagem para calcular o valor por pessoa.';
  }
 }
}
function handleInput(el){const r=activeRoute(),k=el.dataset.kind;if(!k)return;
 const prop=el.dataset.prop,raw=el.value;
 if(k==='groupSize'){if(raw!==''&&Number(raw)>=1&&Number(raw)<=30)state.groupSize=Math.floor(Number(raw));}
 else if(!r)return;
 else if(k==='route')r[prop]=raw;
 else if(k==='city'){const c=r.cities.find(c=>c.id===el.dataset.id);if(c){c[prop]=raw;if(prop==='name'){c.geoLabel='';c.lat=null;c.lon=null;}}}
 else if(k==='flight'){const q=r.flights[el.dataset.dir]?.offers.find(x=>x.id===el.dataset.id);if(q){q[prop]=prop==='price'?parsedAmount(raw):raw;if(['from','to'].includes(prop))q[prop+'Geo']=null;}}
 else if(k==='leg'){const l=r.legs.find(l=>l.id===el.dataset.leg),q=l?.offers.find(x=>x.id===el.dataset.id);if(q)q[prop]=prop==='price'?parsedAmount(raw):raw;}
 else if(k==='legDate'){const l=r.legs.find(l=>l.id===el.dataset.leg);if(l){l.swapDate=raw;l.swapAuto=false;}}
 else if(k==='hotel'){const q=findStay(r,el.dataset.city).offers.find(x=>x.id===el.dataset.id);if(q)q[prop]=prop==='price'?parsedAmount(raw):raw;}
 else if(k==='stay'){const s=findStay(r,el.dataset.city);s[prop]=raw;}
 else if(k==='extra'){const x=r.extras.find(x=>x.id===el.dataset.id);if(x)x[prop]=prop==='price'?parsedAmount(raw):raw;}
 save();
 if(state.screen==='editor'&&r){
   const panel=$('#summaryPanel');if(panel)panel.innerHTML=renderSummary(r);refreshHotelVisuals(r);
   if(k==='extra'){
    const x=r.extras.find(x=>x.id===el.dataset.id),totalEl=document.querySelector(`[data-extra-total="${el.dataset.id}"]`);
    if(x&&totalEl)totalEl.innerHTML=hasNum(x.price)?`<strong>${money(pricePerPersonExtra(x))} por pessoa</strong> · ${money(extraGroupPrice(x))} para ${state.groupSize} pessoas`:'Preço ainda não informado';
   }
  }
}
async function lookupCity(cityId){const r=activeRoute(),c=r?.cities.find(x=>x.id===cityId);if(!c)return;
 const box=document.getElementById('geo-'+c.id);
 const name=c.name.trim();if(name.length<2){showToast('Digite o nome da cidade antes de pesquisar.');return}
 if(box)box.innerHTML='<div class="notice">Buscando cidades no OpenStreetMap…</div>';
 const now=Date.now();const wait=Math.max(0,1100-(now-(window.__lastGeoSearch||0)));
 if(wait)await new Promise(done=>setTimeout(done,wait));window.__lastGeoSearch=Date.now();
 try{
  const q=name+(c.country?', '+c.country:'');
  const url='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&q='+encodeURIComponent(q);
  const resp=await fetch(url,{headers:{'Accept':'application/json'}});
  if(!resp.ok)throw Error('HTTP '+resp.status);
  const res=await resp.json();geoTarget={kind:'city',route:r.id,city:c.id,results:res};
  if(!document.getElementById('geo-'+c.id))return;
  if(!res.length){box.innerHTML='<div class="notice warn">Não encontrei essa localização. Tente escrever o nome no idioma local e o país.</div>';return}
  box.innerHTML='<div class="micro">Selecione o resultado certo (dados © OpenStreetMap):</div>'+res.map((result,index)=>`<button class="geoitem" data-action="chooseGeo" data-city="${c.id}" data-index="${index}">${esc(result.display_name)}</button>`).join('');
 }catch(e){if(box)box.innerHTML='<div class="notice warn">Busca indisponível. Confira sua internet ou use o nome da cidade manualmente; o restante do planejador funciona offline.</div>';}
}
async function lookupAirport(dir,quoteId,side){
 const r=activeRoute(),q=r?.flights?.[dir]?.offers?.find(x=>x.id===quoteId);
 if(!q)return;
 const code=(q[side]||'').trim();if(code.length<2){showToast('Informe primeiro o código ou nome do aeroporto.');return;}
 const box=document.getElementById('geo-airport-'+side+'-'+quoteId);
 if(box)box.innerHTML='<div class="notice">Buscando aeroporto no OpenStreetMap…</div>';
 const wait=Math.max(0,1100-(Date.now()-(window.__lastGeoSearch||0)));
 if(wait)await new Promise(done=>setTimeout(done,wait));window.__lastGeoSearch=Date.now();
 try{
  const term=AIRPORT_HINTS[code.toUpperCase()]||code+(code.toLowerCase().includes('airport')||code.toLowerCase().includes('aeroport')?'':' airport');
  const endpoint='https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=8&q='+encodeURIComponent(term);
  const resp=await fetch(endpoint,{headers:{'Accept':'application/json'}});
  if(!resp.ok)throw Error('HTTP '+resp.status);
  const results=await resp.json();geoTarget={kind:'airport',route:r.id,dir,quoteId,side,results};
  if(!box?.isConnected)return;
  box.innerHTML=results.length?'<div class="micro">Escolha o aeroporto correto (não a cidade ou uma rua):</div>'+results.map((item,index)=>`<button class="geoitem" data-action="chooseAirportGeo" data-dir="${dir}" data-id="${quoteId}" data-side="${side}" data-index="${index}">${esc(item.display_name)}${item.type?' · '+esc(item.type):''}</button>`).join(''):'<div class="notice warn">Aeroporto não encontrado. Tente digitar o nome completo e pesquise novamente.</div>';
 }catch(e){if(box)box.innerHTML='<div class="notice warn">Busca indisponível. Verifique sua internet. Pode continuar registrando voos normalmente.</div>';}
}
function chooseAirportGeo(dir,quoteId,side,index){
 const t=geoTarget,r=activeRoute();if(!t||t.kind!=='airport'||t.route!==r?.id||t.dir!==dir||t.quoteId!==quoteId||t.side!==side||!t.results[index])return;
 const q=r.flights[dir].offers.find(x=>x.id===quoteId);if(!q)return;
 const item=t.results[index],lat=Number(item.lat),lon=Number(item.lon);
 if(!Number.isFinite(lat)||!Number.isFinite(lon))return;
 q[side+'Geo']={lat,lon,label:item.display_name};
 save();render();showToast('Localização do aeroporto salva. Confira a posição no mapa.');
}
function chooseGeo(cityId,index){const t=geoTarget,r=activeRoute();if(!t||t.kind!=='city'||t.route!==r?.id||t.city!==cityId||!t.results[index])return;
 const x=t.results[index],c=r.cities.find(c=>c.id===cityId);if(!c)return;
 c.lat=Number(x.lat);c.lon=Number(x.lon);c.geoLabel=x.display_name||'';
 const city=x.address?.city||x.address?.town||x.address?.village||x.address?.municipality||x.name;
 if(city)c.name=city;
 if(x.address?.country)c.country=x.address.country;
 save();render();showToast('Coordenadas salvas. Confira o país e a posição no mapa.');
}
function handleAction(el){const action=el.dataset.action,r=activeRoute();
 if(action==='go'){state.screen=el.dataset.screen;save();render();return}
 if(action==='newRoute'){const x=newRoute();state.routes.push(x);state.activeId=x.id;state.screen='editor';state.editorTab='cities';save();render();showToast('Roteiro criado. Adicione as cidades para começar.');return}
 if(action==='openRoute'){state.activeId=el.dataset.id;state.screen='editor';state.editorTab='cities';save();render();return}
 if(action==='tab'){state.editorTab=el.dataset.tab;save();render();return}
 if(action==='loadPresets'){
  const existing=new Set(state.routes.map(r=>r.title.toLocaleLowerCase()));
  const missing=PRESETS.filter(([name])=>!existing.has(name.toLocaleLowerCase()));
  if(!missing.length){showToast('Todas as 22 ideias já estão adicionadas.');return}
  if(state.routes.length&&!confirm(`Adicionar ${missing.length} ideias novas à sua lista atual? Os roteiros existentes serão preservados.`))return;
  for(const [name,cities]of missing)state.routes.push(newRoute(name,cities));
  if(!state.activeId)state.activeId=state.routes[0]?.id||null;
  state.screen='dashboard';save();render();showToast(missing.length+' roteiros adicionados, ainda sem valores.');return;
 }
 if(action==='exportJson'){
  const data=JSON.stringify({version:DATA_VERSION,groupSize:state.groupSize,routes:state.routes,activeId:state.activeId},null,2);
  downloadBlob(data,'rota-clara-backup-'+new Date().toISOString().slice(0,10)+'.json','application/json;charset=utf-8');showToast('Backup JSON exportado.');return;
 }
 if(action==='importJson'){$('#fileImport').value='';$('#fileImport').click();return}
 if(action==='print'){printReport(el.dataset.mode);return}
 if(action==='txt'){
  const mode=el.dataset.mode;if(!state.routes.length){showToast('Não há roteiros para exportar.');return}
  if(mode==='current'&&!r){showToast('Selecione um roteiro.');return}
  const name=mode==='current'?filenamePart(r.title):'todos-os-roteiros';
  downloadBlob('\uFEFF'+txtReport(mode),'rota-clara-'+name+'.txt','text/plain;charset=utf-8');showToast('Relatório TXT baixado.');return;
 }
 if(!r){showToast('Primeiro crie ou selecione um roteiro.');return}
 if(action==='deleteRoute'){
  if(!confirm(`Excluir o roteiro "${r.title}"? Essa ação pode ser desfeita apenas restaurando um backup.`))return;
  state.routes=state.routes.filter(x=>x.id!==r.id);state.activeId=state.routes[0]?.id||null;state.screen=state.routes.length?'dashboard':'editor';save();render();showToast('Roteiro excluído.');return;
 }
 if(action==='addCity'){addCityToRoute(r,'');save();render();return}
 if(action==='quickCity'){const name=$('#cityQuick')?.value.trim()||'';if(!name){showToast('Digite a cidade que deseja adicionar.');return}if(r.cities.length>=50){showToast('Limite de 50 cidades por roteiro.');return}addCityToRoute(r,name);save();render();showToast('Cidade adicionada: '+name+'. Clique em Localizar para conferir o lugar.');return}
 if(action==='appendCities'){
  const raw=$('#citiesPaste')?.value||'';
  const names=raw.split(/\s*(?:→|->|;|\n|,|\+)\s*/).map(v=>v.trim()).filter(Boolean).slice(0,25);
  if(!names.length){showToast('Cole ou digite os nomes das cidades.');return}
  for(const name of names)addCityToRoute(r,name);
  if(r.title==='Novo roteiro')r.title=r.cities.map(c=>c.name).join(' → ');
  save();render();showToast(names.length+' cidade(s) adicionada(s).');return;
 }
 if(action==='reverseCities'){r.cities.reverse();syncLegs(r);save();render();showToast('Ordem invertida. Verifique os trechos e os voos.');return}
 if(action==='moveCity'){const i=r.cities.findIndex(c=>c.id===el.dataset.id),j=i+Number(el.dataset.delta);if(i>=0&&j>=0&&j<r.cities.length)reorderCity(r,r.cities[i].id,r.cities[j].id);return}
 if(action==='deleteCity'){
  const c=r.cities.find(c=>c.id===el.dataset.id);if(!c)return;
  if(!confirm(`Remover ${c.name||'esta cidade'}? O hotel associado não será mais mostrado neste roteiro.`))return;
  r.cities=r.cities.filter(c=>c.id!==el.dataset.id);syncLegs(r);save();render();return;
 }
 if(action==='findCity'){lookupCity(el.dataset.id);return}
 if(action==='chooseGeo'){chooseGeo(el.dataset.city,Number(el.dataset.index));return}
  if(action==='findAirport'){lookupAirport(el.dataset.dir,el.dataset.id,el.dataset.side);return}
  if(action==='chooseAirportGeo'){chooseAirportGeo(el.dataset.dir,el.dataset.id,el.dataset.side,Number(el.dataset.index));return}
 if(action==='addQuote'){
  const bucket=getBucketForAction(r,el);if(!bucket)return;
  const q=el.dataset.type==='hotel'?{id:uid(),name:'',price:'',url:'',note:''}:createQuote(el.dataset.type);
  bucket.offers.push(q);bucket.selected=q.id;save();render();showToast('Alternativa adicionada e selecionada.');return;
 }
 if(action==='chooseQuote'){
  const bucket=getBucketForAction(r,el);if(bucket?.offers.some(q=>q.id===el.dataset.id)){bucket.selected=el.dataset.id;save();render();}return;
 }
 if(action==='removeQuote'){
  const bucket=getBucketForAction(r,el);if(!bucket)return;
  if(bucket.offers.length===1){showToast('Mantenha pelo menos uma opção; você pode deixar seus campos vazios.');return}
  bucket.offers=bucket.offers.filter(q=>q.id!==el.dataset.id);
  if(!bucket.offers.some(q=>q.id===bucket.selected))bucket.selected=bucket.offers[0].id;
  save();render();return;
 }
 if(action==='addExtra'){r.extras.push({id:uid(),category:'outro',basis:'person',name:'',date:'',depart:'',arrive:'',mode:'',from:'',to:'',vendor:'',meal:'',place:'',price:'',url:'',note:''});save();render();return}
 if(action==='removeExtra'){r.extras=r.extras.filter(x=>x.id!==el.dataset.id);save();render();return}
}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='cityQuick'){e.preventDefault();handleAction({dataset:{action:'quickCity'}})}});
document.addEventListener('click',e=>{const action=e.target.closest('[data-action]');if(action&&!action.matches('a')){e.preventDefault();handleAction(action)}});
document.addEventListener('input',e=>{if(e.target.matches('[data-kind]'))handleInput(e.target)});
document.addEventListener('change',e=>{
 if(!e.target.matches('[data-kind]'))return;
 handleInput(e.target);
 const k=e.target.dataset.kind,p=e.target.dataset.prop;
 const r=activeRoute();
 if(r&&k==='route'&&['start','end'].includes(p)){syncLegs(r);save();}
 // NÃO reconstruir os formulários no blur: isso pode descartar o clique seguinte
 // ou impedir o preenchimento rápido de outro campo. As abas atualizam ao navegar.
 if(r&&k==='route'&&p==='title'){
  const title=$('#pageTitle h1');if(title)title.textContent=r.title;
  const h=$('.editor .headline');if(h)h.textContent=r.title;
  updateNav();
 }
 if(r&&state.screen==='editor'){
  if(k==='extra'&&['category','basis'].includes(p)){
   // Recriar só cartão alterado: campos adaptativos sem perder as demais cotações.
   const item=r.extras.find(x=>x.id===e.target.dataset.id);
   const card=e.target.closest('[data-extra-id]');
   if(item&&card)card.outerHTML=renderExtraCard(item);
  }
  const panel=$('#summaryPanel');if(panel)panel.innerHTML=renderSummary(r);refreshHotelVisuals(r);
 }
});
$('#fileImport').addEventListener('change',async e=>{
 const file=e.target.files?.[0];if(!file)return;
 if(file.size>5_000_000){showToast('Arquivo grande demais (máximo 5 MB).');return}
 try{
  const txt=await file.text();const data=JSON.parse(txt);
  if(!data||!Array.isArray(data.routes))throw Error('Sem lista de roteiros');
  if(data.routes.length>200)throw Error('Máximo de 200 roteiros');
  for(const r of data.routes){if(!r||!Array.isArray(r.cities)||r.cities.length>50)throw Error('Formato inválido');}
  if(state.routes.length&&!confirm('Restaurar este backup vai substituir todos os roteiros atuais neste navegador. Deseja continuar?'))return;
  upgradeData(data);state.version=DATA_VERSION;state.routes=data.routes;state.groupSize=Number(data.groupSize)>0&&Number(data.groupSize)<=30?Number(data.groupSize):5;
  state.activeId=state.routes.some(r=>r.id===data.activeId)?data.activeId:(state.routes[0]?.id||null);
  state.screen='dashboard';state.editorTab='cities';
  state.routes=state.routes.map(r=>{
   r.flights=r.flights||{out:createBucket('flight'),back:createBucket('flight')};
   r.flights.out=r.flights.out||createBucket('flight');r.flights.back=r.flights.back||createBucket('flight');
   for(const key of ['out','back']){const b=r.flights[key];if(!Array.isArray(b.offers)||!b.offers.length)r.flights[key]=createBucket('flight')}
   r.stays=r.stays||{};r.legArchive=r.legArchive||{};r.legs=Array.isArray(r.legs)?r.legs:[];
   r.extras=Array.isArray(r.extras)?r.extras:[];r.start=r.start||DEFAULT_START;r.end=r.end||DEFAULT_END;
   for(const c of r.cities){if(!c.id)c.id=uid();if(!r.stays[c.id]||!Array.isArray(r.stays[c.id].offers)||!r.stays[c.id].offers.length)r.stays[c.id]=makeStay()}
   syncLegs(r);return r;
  });
  save();render();showToast('Backup restaurado com '+state.routes.length+' roteiros.');
 }catch(err){showToast('Backup inválido: '+(err.message||'arquivo não reconhecido'))}
});
document.addEventListener('dragstart',e=>{
 const card=e.target.closest?.('[data-citydrag]');if(!card||state.screen!=='editor')return;
 dragCity=card.dataset.citydrag;
 e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragCity);
 card.classList.add('dragging');
});
document.addEventListener('dragover',e=>{const card=e.target.closest?.('[data-citydrag]');if(!card||!dragCity)return;e.preventDefault();e.dataTransfer.dropEffect='move';$$('.citycard.over').forEach(x=>x.classList.remove('over'));card.classList.add('over')});
document.addEventListener('drop',e=>{const card=e.target.closest?.('[data-citydrag]');if(!card||!dragCity)return;e.preventDefault();const source=dragCity;dragCity=null;$$('.citycard.over,.citycard.dragging').forEach(x=>x.classList.remove('over','dragging'));if(activeRoute())reorderCity(activeRoute(),source,card.dataset.citydrag)});
document.addEventListener('dragend',()=>{dragCity=null;$$('.citycard.over,.citycard.dragging').forEach(x=>x.classList.remove('over','dragging'))});
window.addEventListener('beforeunload',()=>{try{localStorage.setItem(STORE,JSON.stringify({version:DATA_VERSION,groupSize:state.groupSize,screen:state.screen,activeId:state.activeId,editorTab:state.editorTab,routes:state.routes}))}catch(e){}});
load();render();
</script>
</body>
</html>
